
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="weather-app">
        <header class="app-header">
            <h1>☀️ Weather Dashboard</h1>
            <p>Discover the weather in your city</p>
        </header>

        <form id="searchForm" class="search-form">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                aria-label="City name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="statusMessage" role="status" aria-live="polite">
            Search for a city to see its weather.
        </p>

        <section id="currentWeather" class="weather-card" hidden>
            <h2 id="cityName">City</h2>
            <p id="weatherDescription">Weather condition</p>

            <div class="temperature">
                <img id="weatherIcon" src="" alt="Weather icon">
                <span id="temperature">--°C</span>
            </div>

            <p>Feels like: <span id="feelsLike">--°C</span></p>

            <div class="weather-details">
                <div>
                    <span>💧 Humidity</span>
                    <strong id="humidity">--%</strong>
                </div>

                <div>
                    <span>💨 Wind Speed</span>
                    <strong id="windSpeed">-- m/s</strong>
                </div>
            </div>
        </section>

        <section class="forecast-section">
            <h2>5-Day Forecast</h2>
            <div id="forecastContainer" class="forecast-grid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
